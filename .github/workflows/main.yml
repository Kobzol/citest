name: Auto test

on:
  push:
    branches:
      - automation/bors/auto

jobs:
  test:
    name: Test before deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Print rustup components
        run: |
          rustup toolchain list -v
          rustc --version

      - name: Run command
        run:
          exit 0
